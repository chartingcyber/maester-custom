<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security findings report</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #14202e; --muted: #5b6878; --line: #dde2e8;
  --accent: #14487f; --accent-soft: #e6eef7;
  --crit: #b3261e; --high: #d9622b; --med: #c28a00; --low: #3a7ca5; --ok: #2e8b57; --info: #7a8794;
  --crit-bg: #fbe9e7; --high-bg: #fdeee6; --med-bg: #fff6dc; --low-bg: #e8f1f7; --ok-bg: #e6f4ec; --info-bg: #eef0f2;
  --shadow: 0 1px 2px rgba(20,32,46,.06), 0 4px 12px rgba(20,32,46,.04);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1620; --panel: #16212d; --ink: #e8edf2; --muted: #9aa7b5; --line: #2a3846;
    --accent: #6fb1e6; --accent-soft: #1b2e42;
    --crit: #ff8a80; --high: #ffa070; --med: #f0c04a; --low: #7cc0e8; --ok: #6fcf97; --info: #9aa7b5;
    --crit-bg: #3a1f1d; --high-bg: #3a2519; --med-bg: #36300f; --low-bg: #16303f; --ok-bg: #173226; --info-bg: #1f2a35;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1620; --panel: #16212d; --ink: #e8edf2; --muted: #9aa7b5; --line: #2a3846;
  --accent: #6fb1e6; --accent-soft: #1b2e42;
  --crit: #ff8a80; --high: #ffa070; --med: #f0c04a; --low: #7cc0e8; --ok: #6fcf97; --info: #9aa7b5;
  --crit-bg: #3a1f1d; --high-bg: #3a2519; --med-bg: #36300f; --low-bg: #16303f; --ok-bg: #173226; --info-bg: #1f2a35;
  --shadow: none;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 64px; }
header.top { padding: 28px 0 8px; display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -.01em; }
.sub { color: var(--muted); font-size: 13px; }
.sub b { color: var(--ink); font-weight: 600; }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
nav.tabs { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 8px 0 20px; overflow-x: auto; }
nav.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 12px 14px; font: inherit; font-weight: 600; color: var(--muted); cursor: pointer; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
nav.tabs .n { font-weight: 500; color: var(--muted); margin-left: 4px; font-size: 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; box-shadow: var(--shadow); }
.grid { display: grid; gap: 16px; }
.g-hero { grid-template-columns: minmax(220px, 280px) 1fr; }
.g-2 { grid-template-columns: 1fr 1fr; }
@media (max-width: 820px) { .g-hero, .g-2 { grid-template-columns: 1fr; } }
h2 { font-size: 17px; margin: 0 0 12px; }
h3 { font-size: 14px; margin: 14px 0 6px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.score { text-align: center; }
.ring { width: 180px; height: 180px; margin: 0 auto; }
.ring text { fill: var(--ink); }
.band { display: inline-block; margin-top: 8px; padding: 2px 10px; border-radius: 99px; font-size: 13px; font-weight: 600; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-top: 12px; }
.kpi { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.kpi .v { font-size: 24px; font-weight: 700; line-height: 1.1; }
.kpi .l { font-size: 12px; color: var(--muted); }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 99px; white-space: nowrap; }
.sev-Critical { color: var(--crit); background: var(--crit-bg); }
.sev-High { color: var(--high); background: var(--high-bg); }
.sev-Medium { color: var(--med); background: var(--med-bg); }
.sev-Low { color: var(--low); background: var(--low-bg); }
.sev-Info { color: var(--info); background: var(--info-bg); }
.res-Passed { color: var(--ok); background: var(--ok-bg); }
.res-Failed { color: var(--crit); background: var(--crit-bg); }
.res-Investigate, .res-Skipped, .res-Error, .res-NotRun { color: var(--med); background: var(--med-bg); }
.bar { height: 10px; border-radius: 6px; background: var(--info-bg); overflow: hidden; display: flex; }
.bar > span { display: block; height: 100%; }
.row { display: grid; grid-template-columns: minmax(130px, 220px) 1fr 52px; gap: 10px; align-items: center; padding: 6px 0; font-size: 14px; }
.row .name { overflow: hidden; text-overflow: ellipsis; }
.num { font-variant-numeric: tabular-nums; text-align: right; font-weight: 600; }
.summary p { margin: 0 0 10px; }
.summary p:last-child { margin: 0; }
.quick { display: grid; gap: 8px; }
.qitem { display: flex; gap: 10px; align-items: baseline; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; background: var(--panel); text-align: left; font: inherit; color: inherit; width: 100%; }
.qitem:hover { border-color: var(--accent); }
.qitem .t { flex: 1; }
.qitem .m { font-size: 12px; color: var(--muted); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
.filters input[type=search], .filters select { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 7px 10px; font: inherit; font-size: 13px; }
.filters input[type=search] { flex: 1; min-width: 180px; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 4px 10px; border-radius: 99px; font-size: 12px; cursor: pointer; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--bg); }
.list { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--panel); }
details.f { border-bottom: 1px solid var(--line); }
details.f:last-child { border-bottom: 0; }
details.f > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: grid; grid-template-columns: 78px 1fr auto; gap: 10px; align-items: center; }
details.f > summary::-webkit-details-marker { display: none; }
details.f > summary:hover { background: var(--accent-soft); }
details.f[open] > summary { background: var(--accent-soft); }
.f .title { font-weight: 600; }
.f .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
.f .right { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.body { padding: 4px 18px 18px 18px; border-top: 1px dashed var(--line); }
.body .tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
.tag { font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
.md { font-size: 14px; }
.md p { margin: 0 0 10px; }
.md ul { margin: 0 0 10px; padding-left: 20px; }
a { color: var(--accent); }
.md code { background: var(--info-bg); padding: 1px 5px; border-radius: 4px; font-size: 13px; }
.md table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 6px 0 12px; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
.md th { background: var(--info-bg); }
.empty { padding: 28px; text-align: center; color: var(--muted); }
.why { background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; font-size: 13px; margin: 10px 0; }
table.plain { border-collapse: collapse; width: 100%; font-size: 14px; }
table.plain th, table.plain td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 8px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
footer { margin-top: 28px; color: var(--muted); font-size: 12px; }
@media print { nav.tabs, .btn, .filters { display: none; } .tabpanel { display: block !important; } details.f { break-inside: avoid; } details.f > .body { display: block; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="title"></h1>
      <div class="sub" id="meta"></div>
    </div>
    <div><button class="btn" id="theme" type="button">Light / dark</button></div>
  </header>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main>
    <section class="tabpanel" id="p-overview"></section>
    <section class="tabpanel" id="p-roadmap" hidden></section>
    <section class="tabpanel" id="p-priorities" hidden></section>
    <section class="tabpanel" id="p-paths" hidden></section>
    <section class="tabpanel" id="p-ca" hidden></section>
    <section class="tabpanel" id="p-frameworks" hidden></section>
    <section class="tabpanel" id="p-areas" hidden></section>
    <section class="tabpanel" id="p-admins" hidden></section>
    <section class="tabpanel" id="p-licences" hidden></section>
    <section class="tabpanel" id="p-changes" hidden></section>
    <section class="tabpanel" id="p-notassessed" hidden></section>
    <section class="tabpanel" id="p-method" hidden></section>
  </main>
  <footer id="foot"></footer>
</div>
<script>
const DATA = /*__DATA__*/null;
</script>
<script>
(function () {
  "use strict";
  var D = DATA;
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
  var SEV = ["Critical", "High", "Medium", "Low", "Info"];
  var SEVCOLOR = { Critical: "var(--crit)", High: "var(--high)", Medium: "var(--med)", Low: "var(--low)" };
  var fmtDate = function (s) { var d = new Date(s); return isNaN(d) ? s : d.toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" }); };

  // ---- small markdown renderer (input is escaped first) ----
  function inline(t) {
    t = esc(String(t).replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&amp;/g, "&"));
    t = t.replace(/`([^`]+)`/g, "<code>$1</code>");
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return t;
  }
  function md(src) {
    if (!src) return "";
    var lines = String(src).replace(/\r/g, "").split("\n"), out = [], i = 0;
    while (i < lines.length) {
      var l = lines[i];
      if (!l.trim()) { i++; continue; }
      if (/^\s*\|/.test(l) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        var head = l.trim().replace(/^\||\|$/g, "").split("|"), rows = [];
        i += 2;
        while (i < lines.length && /^\s*\|/.test(lines[i])) { rows.push(lines[i].trim().replace(/^\||\|$/g, "").split("|")); i++; }
        out.push("<table><thead><tr>" + head.map(function (h) { return "<th>" + inline(h.trim()) + "</th>"; }).join("") + "</tr></thead><tbody>" +
          rows.map(function (r) { return "<tr>" + r.map(function (c) { return "<td>" + inline(c.trim()) + "</td>"; }).join("") + "</tr>"; }).join("") + "</tbody></table>");
        continue;
      }
      var hd = /^\s*(#{1,6})\s+(.*)$/.exec(l);
      if (hd) { out.push("<h3>" + inline(hd[2]) + "</h3>"); i++; continue; }
      if (/^\s*[-*•]\s+/.test(l)) {
        var items = [];
        while (i < lines.length && /^\s*[-*•]\s+/.test(lines[i])) { items.push(lines[i].replace(/^\s*[-*•]\s+/, "")); i++; }
        out.push("<ul>" + items.map(function (x) { return "<li>" + inline(x) + "</li>"; }).join("") + "</ul>");
        continue;
      }
      var para = [lines[i]];
      i++;
      while (i < lines.length && lines[i].trim() && !/^\s*\|/.test(lines[i]) && !/^\s*[-*•]\s+/.test(lines[i]) && !/^\s*#{1,6}\s/.test(lines[i])) { para.push(lines[i]); i++; }
      out.push("<p>" + inline(para.join(" ")) + "</p>");
    }
    return out.join("");
  }

  // ---- header ----
  document.title = (D.meta.title || "Security") + " - security findings";
  $("#title").textContent = (D.meta.title || "Tenant") + " security findings";
  var metaParts = [];
  if (D.meta.executedAt) metaParts.push("Assessed <b>" + esc(fmtDate(D.meta.executedAt)) + "</b>");
  if (D.meta.tenantId) metaParts.push("Tenant <b>" + esc(D.meta.tenantId) + "</b>");
  if (D.meta.account) metaParts.push("Run as <b>" + esc(D.meta.account) + "</b>");
  metaParts.push(D.meta.masked ? "Email addresses masked" : "Email addresses shown");
  $("#meta").innerHTML = metaParts.join(" &middot; ");
  $("#foot").textContent = "Generated " + D.meta.generated + " from a Maester result. Read-only assessment; nothing in the tenant was changed. A skipped or unreviewed check is never counted as passed.";

  var theme = null;
  $("#theme").onclick = function () {
    var dark = document.documentElement.getAttribute("data-theme") === "dark" || (!document.documentElement.getAttribute("data-theme") && matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "light" : "dark");
  };

  var F = D.findings;
  var failed = F.filter(function (f) { return f.result === "Failed" && f.severity !== "Info"; });
  var notAssessed = F.filter(function (f) { return f.result !== "Passed" && f.result !== "Failed"; });

  // ---- tabs ----
  var TABS = [
    ["overview", "Overview", ""],
    ["roadmap", "Roadmap", D.bands.now + D.bands.next + D.bands.later],
    ["priorities", "Priorities", failed.length],
    ["paths", "Attack paths", ""],
    ["ca", "Conditional Access", (D.ca && D.ca.length) ? D.ca.filter(function (x) { return x.result === "Failed"; }).length : ""],
    ["frameworks", "Frameworks", ""],
    ["areas", "By area", ""],
    ["admins", "Admins", D.admins ? (D.admins.tables.filter(function (x) { return x.headers[0] === "User"; })[0] || { rows: [] }).rows.length : ""],
    ["licences", "Licences", ""],
    ["changes", "Changes", D.changes ? D.changes.regressed.length + D.changes.fixed.length : ""],
    ["notassessed", "Not assessed", notAssessed.length],
    ["method", "How it is scored", ""]
  ];
  var tabsEl = $("#tabs");
  TABS.forEach(function (t, idx) {
    var b = document.createElement("button");
    b.type = "button"; b.setAttribute("role", "tab"); b.dataset.tab = t[0];
    b.setAttribute("aria-selected", idx === 0 ? "true" : "false");
    b.innerHTML = esc(t[1]) + (t[2] !== "" ? '<span class="n">' + t[2] + "</span>" : "");
    b.onclick = function () { show(t[0]); };
    tabsEl.appendChild(b);
  });
  function show(name) {
    TABS.forEach(function (t) { $("#p-" + t[0]).hidden = t[0] !== name; });
    Array.prototype.forEach.call(tabsEl.children, function (b) { b.setAttribute("aria-selected", b.dataset.tab === name ? "true" : "false"); });
    window.scrollTo({ top: 0 });
    if (location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
  }

  function pathName(id) { var p = (D.paths || []).filter(function (x) { return x.id === id; })[0]; return p ? p.name : ""; }
  function byId(ids) { var set = {}; (ids || []).forEach(function (i) { set[i] = 1; }); return F.filter(function (f) { return set[f.id]; }); }
  function listHtml(rows, limit) { var shown = limit ? rows.slice(0, limit) : rows; return shown.length ? '<div class="list">' + shown.map(function (f) { return findingHtml(f); }).join("") + "</div>" + (limit && rows.length > limit ? '<p class="small muted">Showing ' + limit + " of " + rows.length + ". The full list is on the Priorities tab or in the CSV.</p>" : "") : '<div class="empty">Nothing here.</div>'; }
  // ---- finding component ----
  function findingHtml(f, opts) {
    opts = opts || {};
    var bits = [];
    bits.push('<span class="pill sev-' + esc(f.severity) + '">' + esc(f.severity) + "</span>");
    var right = [];
    if (f.result !== "Failed" && f.result !== "Passed") right.push('<span class="pill res-' + esc(f.result) + '">' + esc(f.result) + "</span>");
    if (f.result === "Passed") right.push('<span class="pill res-Passed">Passed</span>');
    if (f.change === "regressed") right.push('<span class="pill res-Failed">New failure</span>');
    if (f.change === "fixed") right.push('<span class="pill res-Passed">Fixed</span>');
    if (f.quick) right.push('<span class="pill" style="background:var(--accent-soft);color:var(--accent)">Quick win</span>');
    if (f.result === "Failed" && f.severity !== "Info") right.push('<span class="tag" title="Risk / effort">risk ' + f.risk + " &middot; effort " + f.effort + "</span>");
    var meta = [esc(f.id), esc(f.areaName || f.area), esc(f.domain)].filter(Boolean).join(" &middot; ");
    var famLine = f.family ? '<div class="meta">' + f.family.failed + " of " + f.family.total + " scenarios fail</div>" : "";
    var body = "";
    if (f.family) {
      body += '<div class="md"><p><b>' + f.family.failed + "</b> of <b>" + f.family.total + "</b> scenarios fail, " + f.family.passed + " pass" + (f.family.investigate ? ", " + f.family.investigate + " need review" : "") + ".</p>";
      if (f.family.examples && f.family.examples.length) body += "<p>Examples of failing scenarios:</p><ul>" + f.family.examples.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>";
      body += "</div>";
    }
    if (f.kind === "Licence" || f.kind === "Access" || f.kind === "Error" || f.kind === "Other" || f.kind === "Investigate") {
      if (f.reason) body += '<div class="why"><b>Why it was not assessed:</b> ' + esc(f.reason) + "</div>";
    }
    if (f.desc) body += '<h3>What this checks and why it matters</h3><div class="md">' + md(f.desc) + "</div>";
    if (f.detail) body += '<h3>What we found</h3><div class="md">' + md(f.detail) + "</div>";
    if (f.fix && f.result !== "Passed") body += '<h3>How to fix it</h3><div class="md">' + md(f.fix) + "</div>";
    var tags = [];
    if (f.cost && f.cost !== "None") tags.push("Cost: " + f.cost);
    if (f.impact && f.impact !== "None") tags.push("User impact: " + f.impact);
    if (f.suite) tags.push(f.suite);
    var pth = pathName(f.path); if (pth && f.result === "Failed") tags.push("Attack path: " + pth);
    if (f.cis) tags.push("CIS " + f.cis.req + " " + f.cis.level);
    if (f.cisa) tags.push("SCuBA " + f.cisa.req + " " + f.cisa.criticality);
    (f.mitre || []).slice(0, 6).forEach(function (m) { tags.push(m); });
    (f.controls || []).slice(0, 4).forEach(function (m) { tags.push(m); });
    if (tags.length) body += '<div class="tags">' + tags.map(function (t) { return '<span class="tag">' + esc(t) + "</span>"; }).join("") + "</div>";
    return '<details class="f" id="f-' + esc(f.id).replace(/[^\w-]/g, "_") + '"><summary><div>' + bits.join("") + '</div><div><div class="title">' + esc(f.title) + '</div><div class="meta">' + meta + "</div>" + famLine + '</div><div class="right">' + right.join("") + '</div></summary><div class="body">' + body + "</div></details>";
  }
  function openFinding(id) {
    show("priorities");
    var el = document.getElementById("f-" + String(id).replace(/[^\w-]/g, "_"));
    if (!el) { resetFilters(); renderList(); el = document.getElementById("f-" + String(id).replace(/[^\w-]/g, "_")); }
    if (el) { el.open = true; el.scrollIntoView({ block: "center" }); }
  }

  // ---- overview ----
  function band(s) { return s == null ? ["Not scored", "var(--info)", "var(--info-bg)"] : s >= 85 ? ["Strong", "var(--ok)", "var(--ok-bg)"] : s >= 70 ? ["Fair", "var(--med)", "var(--med-bg)"] : s >= 50 ? ["Weak", "var(--high)", "var(--high-bg)"] : ["Poor", "var(--crit)", "var(--crit-bg)"]; }
  function ring(score) {
    var r = 70, c = 2 * Math.PI * r, b = band(score), pct = score == null ? 0 : score / 100;
    return '<svg class="ring" viewBox="0 0 180 180" role="img" aria-label="Score ' + (score == null ? "n/a" : score) + ' out of 100"><circle cx="90" cy="90" r="' + r + '" fill="none" stroke="var(--info-bg)" stroke-width="16"/><circle cx="90" cy="90" r="' + r + '" fill="none" stroke="' + b[1] + '" stroke-width="16" stroke-linecap="round" stroke-dasharray="' + (c * pct) + " " + c + '" transform="rotate(-90 90 90)"/><text x="90" y="92" text-anchor="middle" font-size="44" font-weight="700">' + (score == null ? "-" : score) + '</text><text x="90" y="118" text-anchor="middle" font-size="13" fill="var(--muted)" style="fill:var(--muted)">out of 100</text></svg>';
  }
  function overview() {
    var b = band(D.score), c = D.counts, maxSev = Math.max.apply(null, SEV.slice(0, 4).map(function (s) { return D.severity[s] || 0; }).concat([1]));
    var h = '<div class="grid g-hero"><div class="panel score"><h2>Risk score</h2>' + ring(D.score) + '<div><span class="band" style="color:' + b[1] + ";background:" + b[2] + '">' + b[0] + "</span></div>" +

    h += '<div class="panel" style="margin-bottom:16px"><h2>By user <span class="muted small">(' + userRows.length + ' tested)</span></h2><p class="small muted" style="margin-top:0">Privileged users are each tested on their own. Members and guests are tested through one representative per group of similar users, so the class size shows how many people share the result.</p><div class="filters"><input type="search" id="ca-users-q" placeholder="Filter users" aria-label="Filter users"></div><div class="md"><table><thead><tr><th>User</th><th>Kind or role</th><th>Users like this</th><th>Scenarios</th><th>Failing</th><th>Review</th><th>Excluded from</th></tr></thead><tbody id="ca-users"></tbody></table></div></div>';
    // explorer
    h += '<div class="panel"><h2>Scenario explorer</h2><div class="filters"><input type="search" id="ca-q" placeholder="Search user, app, policy"><select id="ca-kind"><option value="">All users</option>' + uniq(CA, function (r) { return r.kind; }).map(function (x) { return "<option>" + esc(x) + "</option>"; }).join("") + '</select><select id="ca-role"><option value="">All roles</option>' + uniq(CA.reduce(function (a, r) { return a.concat(rolesOf(r).map(function (x) { return { v: x }; })); }, []), function (r) { return r.v; }).map(function (x) { return "<option>" + esc(x) + "</option>"; }).join("") + '</select><select id="ca-result"><option value="Failed">Failing</option><option value="Investigate">Need review</option><option value="Passed">Meeting the expectation</option><option value="">All results</option></select><select id="ca-app"><option value="">All applications</option>' + uniq(CA, function (r) { return r.app; }).map(function (x) { return "<option>" + esc(x) + "</option>"; }).join("") + '</select><select id="ca-client"><option value="">All clients</option>' + uniq(CA, function (r) { return r.client; }).map(function (x) { return "<option>" + esc(x) + "</option>"; }).join("") + '</select><select id="ca-risk"><option value="">All risk levels</option>' + uniq(CA, function (r) { return r.risk; }).map(function (x) { return "<option>" + esc(x) + "</option>"; }).join("") + '</select></div><p class="small muted" id="ca-count"></p><div class="md"><table><thead><tr><th>User</th><th>Application</th><th>Client, platform</th><th>Location</th><th>Risk</th><th>Expected</th><th>Observed</th></tr></thead><tbody id="ca-rows"></tbody></table></div></div>';
    el.innerHTML = h;

    function drawUsers() {
      var q = ($("#ca-users-q").value || "").toLowerCase();
      var rows = userRows.filter(function (u) { return !q || (u.persona + " " + u.kind + " " + u.roles.join(" ") + " " + Object.keys(u.excluded).join(" ")).toLowerCase().indexOf(q) >= 0; }).slice(0, 150);
      $("#ca-users").innerHTML = rows.map(function (u) { return "<tr><td>" + esc(u.persona) + "</td><td>" + esc(u.roles.length ? u.roles.join(", ") : u.kind) + '</td><td class="num">' + u.size + '</td><td class="num">' + u.total + '</td><td class="num">' + (u.failed ? '<span class="pill res-Failed">' + u.failed + "</span>" : "0") + '</td><td class="num">' + u.inv + "</td><td>" + esc(Object.keys(u.excluded).join(", ")) + "</td></tr>"; }).join("") || '<tr><td colspan="7" class="muted">Nothing matches.</td></tr>';
    }
    function observedPill(r) { return '<span class="pill ' + (r.result === "Failed" ? "res-Failed" : r.result === "Passed" ? "res-Passed" : "res-Investigate") + '">' + esc(r.observed) + (r.result === "Failed" ? " (gap)" : r.result === "Investigate" ? " (review)" : "") + "</span>"; }
    function drawRows() {
      var s = caState;
      var rows = CA.filter(function (r) {
        if (s.kind && r.kind !== s.kind) return false; if (s.role && rolesOf(r).indexOf(s.role) < 0) return false; if (s.result && r.result !== s.result) return false; if (s.app && r.app !== s.app) return false; if (s.client && r.client !== s.client) return false; if (s.risk && r.risk !== s.risk) return false;
        return !s.q || (r.persona + " " + r.app + " " + r.enforced.join(" ") + " " + r.reportOnly.join(" ") + " " + r.excluded.join(" ")).toLowerCase().indexOf(s.q) >= 0;
      });
      $("#ca-count").textContent = rows.length + " scenario" + (rows.length === 1 ? "" : "s") + (rows.length > 150 ? ". Showing the first 150. Narrow the filters to see the rest." : "") + " Select a row for the policies that applied.";
      $("#ca-rows").innerHTML = rows.slice(0, 150).map(function (r) {
        var open = !!caState.open[r.id];
        var main = '<tr data-ca="' + esc(r.id) + '" style="cursor:pointer"><td>' + esc(r.persona) + '<div class="small muted">' + esc(rolesOf(r).length ? rolesOf(r).join(", ") : r.kind) + " &middot; " + r.users + " like this</div></td><td>" + esc(r.app) + "</td><td>" + esc(r.client) + ", " + esc(r.platform) + "</td><td>" + esc(r.location) + "</td><td>" + esc(r.risk) + "</td><td>" + esc(r.expected) + "</td><td>" + observedPill(r) + "</td></tr>";
        if (!open) return main;
        return main + '<tr><td colspan="7"><div class="small"><b>Why this is expected:</b> ' + esc(r.why || r.expectNote) + "</div><div class=\"small\" style=\"margin-top:6px\"><b>Enforced policies that applied:</b> " + (r.enforced.length ? esc(r.enforced.join(", ")) : "none") + "</div>" + (r.reportOnly.length ? '<div class="small"><b>Report-only (not counted):</b> ' + esc(r.reportOnly.join(", ")) + "</div>" : "") + '<div class="small"><b>User is included in:</b> ' + (r.included.length ? esc(r.included.join(", ")) : "none") + "</div>" + (r.excluded.length ? '<div class="small"><b>Excluded from:</b> ' + esc(r.excluded.join(", ")) + "</div>" : "") + '<div class="small muted" style="margin-top:6px">' + esc(r.id) + "</div></td></tr>";
      }).join("") || '<tr><td colspan="7" class="muted">Nothing matches these filters.</td></tr>';
      Array.prototype.forEach.call(document.querySelectorAll("#ca-rows tr[data-ca]"), function (tr) { tr.onclick = function () { caState.open[tr.dataset.ca] = !caState.open[tr.dataset.ca]; drawRows(); }; });
    }
    $("#ca-users-q").oninput = drawUsers;
    $("#ca-q").oninput = function (e) { caState.q = e.target.value.toLowerCase(); drawRows(); };
    [["kind", "ca-kind"], ["role", "ca-role"], ["result", "ca-result"], ["app", "ca-app"], ["client", "ca-client"], ["risk", "ca-risk"]].forEach(function (p) { var sel = $("#" + p[1]); sel.value = caState[p[0]]; sel.onchange = function (e) { caState[p[0]] = e.target.value; drawRows(); }; });
    drawUsers(); drawRows();
  }

  // ---- frameworks ----
  var STATE_CLASS = { Passed: "res-Passed", Failed: "res-Failed", "Not assessed": "res-Skipped" };
  function fwTable(headers, rows) { return '<div class="md"><table><thead><tr>' + headers.map(function (x) { return "<th>" + esc(x) + "</th>"; }).join("") + "</tr></thead><tbody>" + rows.join("") + "</tbody></table></div>"; }
  var fwView = "cis", cisLevel = "L1";
  function frameworks() {
    var FW = D.frameworks;
    var views = [["cis", "CIS Microsoft 365"], ["cisa", "CISA SCuBA"], ["nist", "NIST 800-53"], ["mitre", "MITRE ATT&CK"]];
    var h = '<div class="filters">' + views.map(function (v) { return '<button class="chip" type="button" data-fw="' + v[0] + '" aria-pressed="' + (fwView === v[0]) + '">' + v[1] + "</button>"; }).join("") + "</div>";
    if (fwView === "cis") {
      var C = FW.cis, lv = C.levels[cisLevel], done = lv.passed + lv.failed, pct = done ? Math.round(100 * lv.passed / done) : null;
      h += '<div class="panel" style="margin-bottom:16px"><div class="filters"><button class="chip" type="button" data-cis="L1" aria-pressed="' + (cisLevel === "L1") + '">Level 1</button><button class="chip" type="button" data-cis="L2" aria-pressed="' + (cisLevel === "L2") + '">Level 2</button></div>' +
        '<h2>CIS Microsoft 365 Foundations Benchmark ' + esc(C.version) + " &middot; " + (cisLevel === "L1" ? "Level 1" : "Level 2") + '</h2><div class="kpis"><div class="kpi"><div class="v">' + (pct == null ? "-" : pct + "%") + '</div><div class="l">of assessed requirements pass</div></div><div class="kpi"><div class="v" style="color:var(--ok)">' + lv.passed + '</div><div class="l">Pass</div></div><div class="kpi"><div class="v" style="color:var(--crit)">' + lv.failed + '</div><div class="l">Fail</div></div><div class="kpi"><div class="v" style="color:var(--med)">' + lv.notAssessed + '</div><div class="l">Not assessed</div></div><div class="kpi"><div class="v">' + lv.checked + (lv.inBenchmark != null ? '<span class="small muted"> / ' + lv.inBenchmark + "</span>" : "") + '</div><div class="l">Requirements checked</div></div></div>' +
        '<p class="small muted" style="margin:10px 0 0">Not assessed requirements are not counted as passed. A pass means the setting was found as the benchmark requires; it is a sample of the benchmark, not a certification.</p></div>';
      var secs = Object.keys(C.sections);
      secs.forEach(function (sec) {
        var rows = C.rows.filter(function (r) { return r.level === cisLevel && r.section === sec; });
        if (!rows.length) return;
        var p = rows.filter(function (r) { return r.state === "Passed"; }).length, fl = rows.filter(function (r) { return r.state === "Failed"; }).length;
        h += '<details class="panel" style="margin-bottom:10px"' + (fl ? " open" : "") + '><summary style="cursor:pointer;font-weight:600">' + sec + ". " + esc(C.sections[sec]) + ' <span class="muted">(' + p + " pass, " + fl + " fail, " + (rows.length - p - fl) + " not assessed)</span></summary><div style=\"margin-top:10px\">" +
          fwTable(["Requirement", "Check", "Result", "Profile"], rows.map(function (r) { return "<tr><td>" + esc(r.req) + "</td><td>" + esc(r.title) + ' <span class="muted small">' + esc(r.ids.join(", ")) + '</span></td><td><span class="pill ' + STATE_CLASS[r.state] + '">' + esc(r.state) + "</span></td><td>" + esc(r.profile) + "</td></tr>"; })) + "</div></details>";
      });
    } else if (fwView === "cisa") {
      var groups = {};
      FW.cisa.forEach(function (r) { (groups[r.area] = groups[r.area] || []).push(r); });
      h += '<div class="panel" style="margin-bottom:16px"><h2>CISA SCuBA baselines</h2><p class="small muted" style="margin:0">Microsoft 365 secure configuration baselines. SHALL is a requirement, SHOULD a recommendation.</p></div>';
      Object.keys(groups).sort().forEach(function (g) {
        var rows = groups[g], p = rows.filter(function (r) { return r.state === "Passed"; }).length, fl = rows.filter(function (r) { return r.state === "Failed"; }).length;
        h += '<details class="panel" style="margin-bottom:10px"' + (fl ? " open" : "") + '><summary style="cursor:pointer;font-weight:600">' + esc(g) + ' <span class="muted">(' + p + " pass, " + fl + " fail, " + (rows.length - p - fl) + " not assessed)</span></summary><div style=\"margin-top:10px\">" +
          fwTable(["Control", "Level", "Check", "Result"], rows.map(function (r) { return "<tr><td>" + esc(r.req) + "</td><td>" + esc(r.criticality) + "</td><td>" + esc(r.title) + '</td><td><span class="pill ' + STATE_CLASS[r.state] + '">' + esc(r.state) + "</span></td></tr>"; })) + "</div></details>";
      });
    } else if (fwView === "nist") {
      var FAM = { AC: "Access control", AT: "Awareness and training", AU: "Audit and accountability", CA: "Assessment and authorization", CM: "Configuration management", CP: "Contingency planning", IA: "Identification and authentication", IR: "Incident response", MA: "Maintenance", MP: "Media protection", PE: "Physical protection", PL: "Planning", PM: "Program management", PS: "Personnel security", RA: "Risk assessment", SA: "System and services acquisition", SC: "System and communications protection", SI: "System and information integrity", SR: "Supply chain risk management" };
      h += '<div class="panel"><h2>NIST SP 800-53 Rev. 5 control families</h2><p class="small muted" style="margin-top:0">How many checks that map to each family pass or fail. Many checks map to several families.</p>' +
        fwTable(["Family", "Passed", "Failed", "Not assessed"], FW.nist.map(function (r) { return "<tr><td><b>" + esc(r.family) + "</b> " + esc(FAM[r.family] || "") + '</td><td class="num">' + r.passed + '</td><td class="num">' + r.failed + '</td><td class="num">' + r.notAssessed + "</td></tr>"; })) + "</div>";
    } else {
      h += '<div class="panel"><h2>MITRE ATT&amp;CK techniques</h2><p class="small muted" style="margin-top:0">The techniques with the most failed defences. Each technique is a way attackers get in or move; a failed check here is a defence that is missing or weak. Showing the top 40.</p>' +
        fwTable(["Technique", "Passed", "Failed", "Not assessed"], FW.mitre.map(function (r) { return '<tr><td><a href="https://attack.mitre.org/techniques/' + esc(r.technique).replace(".", "/") + '/" target="_blank" rel="noopener noreferrer">' + esc(r.technique) + '</a></td><td class="num">' + r.passed + '</td><td class="num">' + r.failed + '</td><td class="num">' + r.notAssessed + "</td></tr>"; })) + "</div>";
    }
    $("#p-frameworks").innerHTML = h;
    Array.prototype.forEach.call(document.querySelectorAll("[data-fw]"), function (b) { b.onclick = function () { fwView = b.dataset.fw; frameworks(); }; });
    Array.prototype.forEach.call(document.querySelectorAll("[data-cis]"), function (b) { b.onclick = function () { cisLevel = b.dataset.cis; frameworks(); }; });
  }

  // ---- licences ----
  function licences() {
    var L = D.licences, h = '<div class="panel" style="margin-bottom:16px"><h2>Licences and what they unlock</h2><p class="small muted" style="margin:0">' + (L.known ? "Present or absent is read from the tenant's own licence list. " : "The tenant's licence list could not be read, so present or absent is not shown. ") + "A check that needs a licence the tenant lacks is not a failure: the control cannot exist without it. It is listed here, not scored.</p></div>";
    var gaps = L.catalog.filter(function (c) { return c.present === false || c.blocked.length; }).sort(function (a, b) { return b.blocked.length - a.blocked.length; });
    h += '<div class="panel"><table class="plain"><thead><tr><th>Licence</th><th>Tenant has it</th><th class="num">Checks blocked</th><th>What it unlocks</th></tr></thead><tbody>' +
      L.catalog.map(function (c) { return "<tr><td><b>" + esc(c.name) + '</b><div class="small muted">' + esc(c.code) + '</div></td><td>' + (c.present === true ? '<span class="pill res-Passed">Yes</span>' : c.present === false ? '<span class="pill res-Failed">No</span>' : '<span class="pill res-Skipped">Unknown</span>') + '</td><td class="num">' + c.blocked.length + '</td><td class="small">' + esc(c.unlocks) + "</td></tr>"; }).join("") + "</tbody></table></div>";
    gaps.forEach(function (c) {
      if (!c.blocked.length) return;
      h += '<details class="panel" style="margin-top:16px"><summary style="cursor:pointer;font-weight:600">' + esc(c.name) + ' <span class="muted">(' + c.blocked.length + " checks could not run or need review)</span></summary><div style=\"margin-top:12px\">" + listHtml(byId(c.blocked), 40) + "</div></details>";
    });
    $("#p-licences").innerHTML = h;
  }

  // ---- changes since the previous run ----
  function changes() {
    var C = D.changes;
    if (!C) { $("#p-changes").innerHTML = '<div class="panel"><h2>Changes since the last run</h2><p class="muted">No earlier run of this tenant was found beside this one. Run the assessment again later, then regenerate this report to see what improved and what got worse. Use <code>-ComparePath</code> to compare against a specific earlier result.</p></div>'; return; }
    var delta = (D.score != null && C.previousScore != null) ? D.score - C.previousScore : null;
    var h = '<div class="panel" style="margin-bottom:16px"><h2>Changes since ' + esc(fmtDate(C.previousAt)) + '</h2><div class="kpis"><div class="kpi"><div class="v">' + (C.previousScore == null ? "-" : C.previousScore) + " &rarr; " + (D.score == null ? "-" : D.score) + '</div><div class="l">Score' + (delta == null ? "" : " (" + (delta >= 0 ? "+" : "") + delta + ")") + '</div></div><div class="kpi"><div class="v" style="color:var(--ok)">' + C.fixed.length + '</div><div class="l">Now pass</div></div><div class="kpi"><div class="v" style="color:var(--crit)">' + C.regressed.length + '</div><div class="l">Newly fail</div></div><div class="kpi"><div class="v">' + C.still.length + '</div><div class="l">Still failing</div></div><div class="kpi"><div class="v">' + C.newChecks.length + '</div><div class="l">New checks</div></div><div class="kpi"><div class="v">' + C.changed.length + '</div><div class="l">Other change</div></div></div><p class="small muted" style="margin:10px 0 0">' + esc(C.note) + "</p></div>";
    [["regressed", "Newly failing", "These passed last time and fail now. Look at these first."], ["fixed", "Now passing", "These failed last time and pass now."], ["changed", "Other result changes", "For example a check that errored last time and ran this time."], ["newChecks", "New checks", "Not in the earlier run."]].forEach(function (g) {
      var rows = byId(C[g[0]]);
      if (!rows.length) return;
      h += '<h3 style="margin:20px 0 4px">' + g[1] + ' <span class="muted">(' + rows.length + ')</span></h3><p class="small muted" style="margin:0 0 8px">' + g[2] + "</p>" + listHtml(rows, 30);
    });
    $("#p-changes").innerHTML = h;
  }

  // ---- not assessed ----
  var KIND = {
    Licence: ["Needs a licence the tenant does not have", "Not a failure. The control cannot exist without the licence. Where it matters, the finding is to consider the licence, or check by hand."],
    Access: ["Needs more access than the sign-in had", "The account lacked a role or permission. Run again with an account that has it, or approve the extra Graph permission."],
    Error: ["Could not run (error)", "The check failed to run. These are shown so they are never mistaken for a pass."],
    Investigate: ["Needs a person to review", "The check cannot decide automatically. Each says what to look at."],
    Other: ["Skipped for another reason", "The reason is shown on each."],
    NotConnected: ["Service not connected", "A service outside this assessment's scope."],
    NotApplicable: ["Not applicable here", "The feature is not in use, or the check is retired."]
  };
  function notAss() {
    var h = '<div class="panel" style="margin-bottom:16px"><h2>What was not assessed, and why</h2><p class="muted small" style="margin:0">Coverage is ' + (D.coverage == null ? "n/a" : D.coverage + "%") + ' of in-scope checks. None of the checks below is counted as passed, and none lowers the score.</p></div>';
    var order = ["Error", "Investigate", "Access", "Licence", "Other", "NotApplicable", "NotConnected"];
    order.forEach(function (k) {
      var set = notAssessed.filter(function (f) { return (f.kind || "Other") === k; });
      if (!set.length) return;
      h += '<h3 style="margin-top:18px">' + esc(KIND[k][0]) + ' <span class="muted">(' + set.length + ')</span></h3><p class="small muted" style="margin:0 0 8px">' + esc(KIND[k][1]) + '</p><div class="list">' + set.map(function (f) { return findingHtml(f); }).join("") + "</div>";
    });
    if (D.notRun && D.notRun.length) {
      h += '<h3 style="margin-top:18px">Did not run <span class="muted">(' + D.counts.notRun + ')</span></h3><p class="small muted" style="margin:0 0 8px">Optional services and previews that were not part of this assessment.</p><div class="panel"><table class="plain"><tbody>' + D.notRun.map(function (g) { return "<tr><td>" + esc(g.label) + '</td><td class="num">' + g.count + "</td></tr>"; }).join("") + "</tbody></table></div>";
    }
    $("#p-notassessed").innerHTML = h;
  }

  // ---- method ----
  function method() {
    var m = D.model, h = '<div class="panel md"><h2>How the ranking works</h2>' +
      "<p><b>Risk</b> = the check's severity weight x a multiplier for its area, so a gap in privileged access or sign-in counts for more than the same severity in a less exposed area.</p>" +
      "<p><b>Effort</b> = the check's implementation cost plus its user impact. <b>Priority</b> = risk divided by effort, so cheap fixes for serious gaps come first.</p>" +
      "<p><b>Quick win</b> = a failed check with risk of at least " + m.quickWin.MinRisk + " and effort of at most " + m.quickWin.MaxEffort + ". <b>Roadmap</b>: Now = quick wins; Next = other failures with risk of at least " + m.roadmap.NextMinRisk + " and effort of at most " + m.roadmap.NextMaxEffort + "; Later = the rest.</p>" +
      "<p><b>Attack paths</b> group failed checks by the kind of attack they let through, using each check's MITRE ATT&amp;CK techniques, then its area. The mapping is in risk-model.json and can be changed.</p>" +
      "<p><b>Score</b> = the risk-weighted share of assessed checks that passed. Skipped, errored and needs-review checks are left out and listed on the Not assessed tab. Informational checks carry no weight. A check that expands into many scenarios counts once.</p>" +
      "<p><b>Coverage</b> = assessed checks as a share of in-scope checks. Checks for services outside the assessment, retired checks and features not in use are not in scope.</p>" +
      "<p>Severity, cost and user impact come from each check's own metadata and are general, not specific to this organisation. Confirm the top items with the people who run the tenant before committing a schedule. The weights below are a starting point and can be changed.</p>" +
      '<h3>Severity weights</h3><table><tbody>' + Object.keys(m.severityWeight).map(function (k) { return "<tr><td>" + esc(k) + "</td><td>" + m.severityWeight[k] + "</td></tr>"; }).join("") + "</tbody></table>" +
      '<h3>Area multipliers</h3><table><tbody>' + Object.keys(m.areaMultiplier).map(function (k) { return "<tr><td>" + esc(k) + "</td><td>" + m.areaMultiplier[k] + "</td></tr>"; }).join("") + "</tbody></table>" +
      "<h3>Limits</h3><ul><li>The same weakness can appear in more than one suite (for example a Maester check and a CIS check). The ranking does not merge them yet, so one weakness may be listed more than once.</li><li>A pass means the setting was found as required. It does not prove the control works against an attacker.</li><li>Results describe the tenant at the time of the run.</li></ul></div>";
    $("#p-method").innerHTML = h;
  }

  overview(); roadmap(); priorities(); paths(); caTab(); frameworks(); areas(); adminsTab(); licences(); changes(); notAss(); method();
  var start = (location.hash || "").slice(1);
  show(TABS.some(function (t) { return t[0] === start; }) ? start : "overview");
})();
</script>
</body>
</html>
